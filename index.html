<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>CBT Ujian DKV XI - Anti-Photo & Anti-OCR Shield</title>
  <style>
    /* Reset & Kunci Proteksi Teks */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none !important;
      -webkit-user-select: none !important;
      -moz-user-select: none !important;
      -ms-user-select: none !important;
      -webkit-touch-callout: none !important;
    }

    @media print {
      html, body { display: none !important; }
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #0b0f19;
      color: #cbd5e1;
      font-family: system-ui, -apple-system, sans-serif;
      touch-action: pan-y;
    }

    #app-container {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    header {
      height: 56px;
      background: #1e293b;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
      border-bottom: 1px solid #334155;
      flex-shrink: 0;
      z-index: 10;
    }

    .header-title {
      font-weight: bold;
      font-size: 0.95rem;
      color: #38bdf8;
    }

    .timer {
      font-weight: bold;
      color: #f59e0b;
      font-size: 1.1rem;
      background: #0f172a;
      padding: 4px 12px;
      border-radius: 6px;
      border: 1px solid #334155;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    @media (min-width: 768px) {
      main { flex-direction: row; }
    }

    .question-panel {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .question-header {
      font-size: 0.9rem;
      color: #94a3b8;
      margin-bottom: 8px;
    }

    /* Canvas Render Soal Anti-OCR & Anti-Kamera */
    #question-canvas {
      width: 100%;
      height: auto;
      min-height: 120px;
      margin-bottom: 15px;
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 8px;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
      z-index: 5;
    }

    .option-btn {
      padding: 14px 16px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #e2e8f0;
      text-align: left;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
    }

    .option-btn:hover { background: #334155; }

    .option-btn.selected {
      background: #2563eb;
      border-color: #60a5fa;
      font-weight: bold;
      color: #ffffff;
    }

    .nav-controls {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: auto;
      padding-top: 10px;
      z-index: 5;
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .btn-secondary { background: #334155; color: white; }
    .btn-primary { background: #2563eb; color: white; }
    .btn-success { background: #16a34a; color: white; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .sidebar-panel {
      width: 100%;
      background: #1e293b;
      border-top: 1px solid #334155;
      padding: 12px;
      display: flex;
      flex-direction: column;
      max-height: 200px;
      z-index: 5;
    }

    @media (min-width: 768px) {
      .sidebar-panel {
        width: 280px;
        max-height: 100%;
        border-top: none;
        border-left: 1px solid #334155;
      }
    }

    .sidebar-title {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .number-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(40px, 1fr));
      gap: 6px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .num-btn {
      aspect-ratio: 1;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #cbd5e1;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .num-btn.active {
      border-color: #38bdf8;
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.3);
    }

    .num-btn.answered {
      background: #16a34a;
      color: white;
      border-color: #22c55e;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(11, 15, 25, 0.98);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 24px;
    }

    .form-group {
      width: 100%;
      max-width: 320px;
      margin-bottom: 16px;
      text-align: left;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      color: white;
      font-size: 1rem;
    }

    .form-group input:focus {
      outline: none;
      border-color: #2563eb;
    }

    /* Watermark Tebal Berkedip (Merusak Hasil Foto Kamera HP) */
    #watermark-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-around;
      align-content: space-around;
      opacity: 0.22;
      overflow: hidden;
      animation: wmFlicker 3s infinite alternate;
    }

    @keyframes wmFlicker {
      0% { opacity: 0.18; }
      50% { opacity: 0.28; }
      100% { opacity: 0.18; }
    }

    .wm-item {
      font-size: 1.3rem;
      font-weight: 800;
      color: #38bdf8;
      transform: rotate(-25deg);
      white-space: nowrap;
      margin: 24px;
      text-shadow: 0 0 2px rgba(0,0,0,0.8);
    }

    #centipede-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9998;
    }
  </style>
</head>
<body>

  <!-- Layer Canvas Kelabang -->
  <canvas id="centipede-canvas"></canvas>

  <div id="start-overlay" class="overlay">
    <h2 style="color: #38bdf8; margin-bottom: 8px;">Ujian CBT DKV Kelas XI</h2>
    <p style="color: #94a3b8; font-size: 0.9rem; margin-bottom: 8px;">Materi: Dasar & Teknik Fotografi - Videografi</p>
    <p style="color: #f59e0b; font-size: 0.85rem; font-weight: bold; margin-bottom: 20px;">🔒 High Security: Anti-Photo Camera & Anti-OCR AI</p>

      <label for="student-name">Nama Lengkap Siswa:</label>

    let questions = [];

    function shuffleArray(array) {
      let curId = array.length;
      let clone = [...array];
      while (0 !== curId) {
        let randId = Math.floor(Math.random() * curId);
        curId -= 1;
        let tmp = clone[curId];
        clone[curId] = clone[randId];
        clone[randId] = tmp;
      }
      return clone;
    }

      }
    });

    // BLOKIR INTERAKSI / SCREENSHOT / COPY
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('copy', e => e.preventDefault());
    document.addEventListener('cut', e => e.preventDefault());
    document.addEventListener('paste', e => e.preventDefault());
    document.addEventListener('selectstart', e => e.preventDefault());

    document.addEventListener('keydown', e => {
      if (
        e.key === 'PrintScreen' || 
        e.key === 'F12' || 
        e.key === 'Meta' || 
        (e.ctrlKey && (e.key === 'p' || e.key === 's' || e.key === 'u' || e.key === 'c')) ||
        (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'S'))
      ) {
        e.preventDefault();
        e.stopPropagation();
        
        if (navigator.clipboard) {
          navigator.clipboard.writeText('');
        }

        if (document.getElementById('start-overlay').style.display === 'none') {
          handleViolation("Pintasan Screenshot / Copy / Inspeksi terdeteksi dan diblokir!");
        }
      }
    });

    function initExam() {
      const nameVal = document.getElementById('student-name').value.trim();
      const nisVal = document.getElementById('student-nis').value.trim();

      if (!nameVal || !nisVal) {
        alert("Mohon isi Nama Lengkap dan NIS terlebih dahulu!");
        return;
      }

      localStorage.setItem('cbt_student_name', nameVal);
      localStorage.setItem('cbt_student_nis', nisVal);

      studentData.name = nameVal;
      studentData.nis = nisVal;
      document.getElementById('display-student').innerText = `${nameVal} (${nisVal})`;

      generateWatermark(nameVal, nisVal);

      const shuffledBank = shuffleArray(allQuestionsBank).slice(0, 50);

      questions = shuffledBank.map(item => {
        const shuffledOpts = shuffleArray(item.options);
        return {
          id: item.id,
          q: item.q,
          options: shuffledOpts,
          correctAnswerText: item.answer
        };
      });

      requestFullscreenMode();
      document.getElementById('start-overlay').style.display = 'none';

      buildNumberGrid();
      loadQuestion(0);
      startTimer();
      setupAntiCheat();

      setTimeout(spawnProceduralCentipede, 10000);
    }

    function generateWatermark(name, nis) {
      const wmLayer = document.getElementById('watermark-layer');
      wmLayer.innerHTML = '';
      for (let i = 0; i < 20; i++) {
        const div = document.createElement('div');
        div.className = 'wm-item';
        div.innerText = `${name} • ${nis}`;
        wmLayer.appendChild(div);
      }
    }

    function requestFullscreenMode() {
      const elem = document.documentElement;
      if (elem.requestFullscreen) {
        elem.requestFullscreen().catch(() => {});
      } else if (elem.webkitRequestFullscreen) {
        elem.webkitRequestFullscreen();
      }
    }

    function setupAntiCheat() {
      document.addEventListener("visibilitychange", () => {
        if (document.hidden && document.getElementById('start-overlay').style.display === 'none') {
          handleViolation("Anda terdeteksi berpindah tab, membuka aplikasi lain, atau screenshot.");
        }
      });

      document.addEventListener("fullscreenchange", () => {
        if (!document.fullscreenElement && document.getElementById('start-overlay').style.display === 'none') {
          handleViolation("Anda keluar dari mode layar penuh (Fullscreen).");
        }
      });

      window.addEventListener("blur", () => {
        if (document.getElementById('start-overlay').style.display === 'none') {
          handleViolation("Layar kehilangan fokus (terdeteksi tombol Windows / SS / menu luar).");
        }
      });
    }

    function handleViolation(reasonText) {
      cheatViolations++;
      if (cheatViolations >= maxViolations) {
        alert(`Batas pelanggaran keamanan tercapai (${cheatViolations}/${maxViolations}). Jawaban Anda akan di-submit otomatis.`);
        submitExam("Diskualifikasi: Pelanggaran Keamanan Berulang");
      } else {
        document.getElementById('warning-msg').innerText = `${reasonText}\n\nPeringatan (${cheatViolations}/${maxViolations}). Jika mencapai ${maxViolations} kali, ujian akan dihentikan secara otomatis.`;
        document.getElementById('warning-overlay').style.display = 'flex';
      }
    }

    function resumeExam() {
      requestFullscreenMode();
      document.getElementById('warning-overlay').style.display = 'none';
    }

    function startTimer() {
      timerInterval = setInterval(() => {
        timeLeft--;
        const mins = Math.floor(timeLeft / 60);
        const secs = timeLeft % 60;
        document.getElementById('timer-display').innerText = 
          `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;

        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          alert("Waktu ujian telah habis!");
          submitExam("Waktu Habis");
        }
      }, 1000);
    }

    function buildNumberGrid() {
      const grid = document.getElementById('number-grid');
      grid.innerHTML = '';
      for (let i = 0; i < questions.length; i++) {
        const btn = document.createElement('button');
        btn.className = 'num-btn';
        btn.id = `num-btn-${i}`;
        btn.innerText = i + 1;
        btn.onclick = () => loadQuestion(i);
        grid.appendChild(btn);
      }
    }

    // RENDER CANVAS DENGAN ANTI-OCR AI & MIKRO-INTERFERENSI
    function renderQuestionToCanvas(text) {
      const canvas = document.getElementById('question-canvas');
      const ctx = canvas.getContext('2d');
      
      const width = canvas.parentElement.clientWidth - 32;
      canvas.width = width;

      ctx.font = "bold 16px Courier New, monospace";
      const words = text.split(' ');
      let line = '';
      let lines = [];
      const maxWidth = width - 24;

      for (let n = 0; n < words.length; n++) {
        let testLine = line + words[n] + ' ';
        if (ctx.measureText(testLine).width > maxWidth && n > 0) {
          lines.push(line);
          line = words[n] + ' ';
        } else {
          line = testLine;
        }
      }
      lines.push(line);

      const lineHeight = 28;
      canvas.height = (lines.length * lineHeight) + 36;

      // 1. Base Dark Background
      ctx.fillStyle = "#111827";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 2. High-Density Micro Noise (Mengacaukan Deteksi OCR AI)
      for (let i = 0; i < 800; i++) {
        ctx.fillStyle = Math.random() > 0.5 ? "rgba(255, 255, 255, 0.05)" : "rgba(0, 0, 0, 0.35)";
        ctx.fillRect(Math.random() * canvas.width, Math.random() * canvas.height, 2, 2);
      }

      // 3. Garis Potong Horizontal Halus (Diskonfigurasi Piksel Huruf AI)
      ctx.strokeStyle = "rgba(241, 245, 249, 0.12)";
      ctx.lineWidth = 1;
      for (let i = 4; i < canvas.height; i += 6) {
        ctx.beginPath();
        ctx.moveTo(0, i);
        ctx.lineTo(canvas.width, i);
        ctx.stroke();
      }

      // 4. Render Huruf per Huruf dengan Jitter Jarak (Mata Tetap Nyaman, AI Bingung)
      let y = 30;
      ctx.font = "bold 16px system-ui, sans-serif";

      for (let i = 0; i < lines.length; i++) {
        let currentLine = lines[i];
        let startX = 12;

        for (let charIdx = 0; charIdx < currentLine.length; charIdx++) {
          const char = currentLine[charIdx];
          
          // Warna teks kontras sedang (nyaman di mata manusia, membingungkan sensor kamera)
          ctx.fillStyle = "#e2e8f0";
          
          // Render Karakter
          ctx.fillText(char, startX, y);

          // Geser posisi X dengan sedikit variasi acak halus
          const charWidth = ctx.measureText(char).width;
          startX += charWidth + (Math.random() * 0.4);
        }
        y += lineHeight;
      }
    }

    function loadQuestion(idx) {
      currentIdx = idx;
      document.getElementById('current-num').innerText = idx + 1;

      renderQuestionToCanvas(questions[idx].q);

      document.getElementById('btn-prev').disabled = (idx === 0);
      document.getElementById('btn-next').disabled = (idx === questions.length - 1);

      document.querySelectorAll('.num-btn').forEach((btn, i) => {
        btn.classList.toggle('active', i === idx);
      });

      const container = document.getElementById('options-container');
      container.innerHTML = '';

      const letters = ['A', 'B', 'C', 'D'];
      questions[idx].options.forEach((optText, oIdx) => {
        const letter = letters[oIdx];
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        
        if (userAnswers[questions[idx].id] === optText) {
          btn.classList.add('selected');
        }
        
        btn.innerText = `${letter}. ${optText}`;
        btn.onclick = () => selectOption(questions[idx].id, optText);
        container.appendChild(btn);
      });
    }

    function selectOption(qId, selectedText) {
      userAnswers[qId] = selectedText;
      loadQuestion(currentIdx);

      const numBtn = document.getElementById(`num-btn-${currentIdx}`);
      if (numBtn) {
        numBtn.classList.add('answered');
      }
    }

    function changeQuestion(dir) {
      const newIdx = currentIdx + dir;
      if (newIdx >= 0 && newIdx < questions.length) {
        loadQuestion(newIdx);
      }
    }

    function confirmSubmit() {
      const answeredCount = Object.keys(userAnswers).length;
      const total = questions.length;
      if (confirm(`Anda telah menjawab ${answeredCount} dari ${total} soal.\nApakah Anda yakin ingin menyelesaikan ujian?`)) {
        submitExam("Selesai Normal");
      }
    }

    window.restartExamDirectly = function() {
      localStorage.setItem('cbt_auto_restart', 'true');
      window.location.reload();
    };

    function submitExam(statusReason) {
      clearInterval(timerInterval);

      let correctAnswers = 0;
      questions.forEach(q => {
        if (userAnswers[q.id] === q.correctAnswerText) {
          correctAnswers++;
        }
      });

      const finalScore = (correctAnswers / questions.length) * 100;
      const isPassed = finalScore >= 80;
      const statusLulus = isPassed ? "LULUS" : "REMIDI (Wajib Ulang)";

      const payload = {
        name: studentData.name,
        nis: studentData.nis,
        score: finalScore,
        correctCount: correctAnswers,
        totalQuestions: questions.length,
        status: `${statusReason} | ${statusLulus}`,
        violations: cheatViolations,
        answers: userAnswers
      };

      fetch(GAS_WEBAPP_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      }).catch(err => console.error("Error submitting:", err));

      if (isPassed) {
        localStorage.removeItem('cbt_student_name');
        localStorage.removeItem('cbt_student_nis');

        document.body.innerHTML = `
          <div class="overlay">
            <h2 style="color: #22c55e; margin-bottom: 12px;">Selamat, Anda LULUS!</h2>
            <p style="color: #cbd5e1; margin-bottom: 8px;">Terima kasih, <b>${studentData.name}</b>.</p>
            <p style="color: #94a3b8; font-size: 0.9rem; margin-bottom: 24px;">Nilai Anda telah memenuhi batas minimal ketuntasan (KKM 80).</p>
            <div style="background: #1e293b; padding: 20px; border-radius: 8px; border: 1px solid #334155; min-width: 260px; text-align: center;">
              <div style="font-size: 0.85rem; color: #94a3b8;">Nilai Akhir:</div>
              <div style="font-size: 2.8rem; font-weight: bold; color: #22c55e;">${finalScore.toFixed(1)}</div>
              <div style="font-size: 0.85rem; color: #cbd5e1; margin-top: 4px;">Benar ${correctAnswers} dari ${questions.length} Soal</div>
            </div>
          </div>
        `;
      } else {
        document.body.innerHTML = `
          <div class="overlay">
            <h2 style="color: #ef4444; margin-bottom: 12px;">Nilai Belum Mencapai Target!</h2>
            <p style="color: #cbd5e1; margin-bottom: 8px;">Mohon maaf, <b>${studentData.name} (${studentData.nis})</b>.</p>
            <p style="color: #f87171; font-size: 0.9rem; margin-bottom: 20px;">Batas minimal nilai adalah <b>80</b>. Anda wajib mengulangi ujian ini.</p>
            
            <div style="background: #1e293b; padding: 20px; border-radius: 8px; border: 1px solid #334155; min-width: 260px; text-align: center; margin-bottom: 24px;">
              <div style="font-size: 0.85rem; color: #94a3b8;">Nilai Percobaan Ini:</div>
              <div style="font-size: 2.8rem; font-weight: bold; color: #ef4444;">${finalScore.toFixed(1)}</div>
              <div style="font-size: 0.85rem; color: #cbd5e1; margin-top: 4px;">Benar ${correctAnswers} dari ${questions.length} Soal</div>
            </div>

            <button class="btn btn-primary" style="padding: 14px 28px; font-size: 1rem;" onclick="restartExamDirectly()">
              🔄 Mengulang Ujian Sekarang
            </button>
          </div>
        `;
      }
    }

    /* KELABANG GARIS-GARIS ANIMATED */
    const canvas = document.getElementById('centipede-canvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    let centipede = null;

    class Centipede {
      constructor() {
        this.numSegments = 16;
        this.segmentLength = 8;
        this.x = -100;
        this.y = Math.random() * (canvas.height - 200) + 100;
        this.angle = 0;
        this.speed = 2.2;
        this.health = 5;
        this.isDead = false;
        this.squishFactor = 1;
        this.legWiggle = 0;

        this.segments = [];
        for (let i = 0; i < this.numSegments; i++) {
          this.segments.push({ x: this.x - i * this.segmentLength, y: this.y });
        }
      }

      update() {
        if (this.isDead) {
          if (this.squishFactor > 0.1) this.squishFactor -= 0.05;
          return;
        }

        this.legWiggle += 0.3;
        this.angle += Math.sin(this.legWiggle * 0.3) * 0.05;

        this.x += Math.cos(this.angle) * this.speed;
        this.y += Math.sin(this.angle) * this.speed;
        this.segments[0] = { x: this.x, y: this.y };

        for (let i = 1; i < this.numSegments; i++) {
          const prev = this.segments[i - 1];
          const curr = this.segments[i];
          const dx = prev.x - curr.x;
          const dy = prev.y - curr.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist > 0) {
            curr.x = prev.x - (dx / dist) * this.segmentLength;
            curr.y = prev.y - (dy / dist) * this.segmentLength;
          }
        }
      }

      draw() {
        ctx.save();
        for (let i = this.numSegments - 1; i >= 0; i--) {
          const seg = this.segments[i];
          const nextSeg = this.segments[i - 1] || seg;
          const segAngle = Math.atan2(nextSeg.y - seg.y, nextSeg.x - seg.x);

          ctx.save();
          ctx.translate(seg.x, seg.y);
          ctx.rotate(segAngle);
          ctx.scale(1, this.squishFactor);

          if (i > 0 && i < this.numSegments - 1) {
            ctx.strokeStyle = '#ea580c';
            ctx.lineWidth = 2;

            const legWave = Math.sin(this.legWiggle + i * 0.6) * 10;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(-2, -14 - legWave);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(-2, 14 + legWave);
            ctx.stroke();
          }

          ctx.fillStyle = i === 0 ? '#b91c1c' : '#c2410c';
          ctx.beginPath();
          ctx.ellipse(0, 0, 6, 4, 0, 0, Math.PI * 2);
          ctx.fill();

          if (i === 0) {
            ctx.strokeStyle = '#ef4444';
            ctx.lineWidth = 1.5;
            
            ctx.beginPath();
            ctx.moveTo(4, -2);
            ctx.lineTo(16, -10);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(4, 2);
            ctx.lineTo(16, 10);
            ctx.stroke();
          }

          ctx.restore();
        }
        ctx.restore();
      }

      hitTest(mx, my) {
        for (let seg of this.segments) {
          const dx = mx - seg.x;
          const dy = my - seg.y;
          if (Math.sqrt(dx * dx + dy * dy) < 22) {
            return true;
          }
        }
        return false;
      }
    }

    function animateCentipede() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (centipede) {
        centipede.update();
        centipede.draw();

        if (centipede.x > canvas.width + 150) {
          centipede = null;
        }
      }

      requestAnimationFrame(animateCentipede);
    }
    animateCentipede();

    function spawnProceduralCentipede() {
      if (document.getElementById('start-overlay').style.display !== 'none') return;
      if (!centipede) {
        centipede = new Centipede();
      }
    }

    window.addEventListener('click', (e) => {
      if (centipede && !centipede.isDead) {
        if (centipede.hitTest(e.clientX, e.clientY)) {
          centipede.health--;
          centipede.speed += 0.5;

          if (centipede.health <= 0) {
            centipede.isDead = true;
            setTimeout(() => {
              centipede = null;
            }, 2000);
          }
        }
      }
    });

    setInterval(() => {
      if (Math.random() > 0.3) {
        spawnProceduralCentipede();
      }
    }, 40000);
  </script>
