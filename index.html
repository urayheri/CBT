<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>CBT Ujian DKV XI - Fotografi & Videografi (Acak System)</title>
  <style>
    /* Reset & Kunci Layout Anti-Geser */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      touch-action: pan-y;
    }

    #app-container {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
    }

    header {
      height: 56px;
      background: #1e293b;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
      border-bottom: 1px solid #334155;
      flex-shrink: 0;
    }

    .header-title {
      font-weight: bold;
      font-size: 0.95rem;
      color: #38bdf8;
    }

    .timer {
      font-weight: bold;
      color: #f59e0b;
      font-size: 1.1rem;
      background: #0f172a;
      padding: 4px 12px;
      border-radius: 6px;
      border: 1px solid #334155;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    @media (min-width: 768px) {
      main {
        flex-direction: row;
      }
    }

    .question-panel {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .question-header {
      font-size: 0.9rem;
      color: #94a3b8;
      margin-bottom: 8px;
    }

    .question-text {
      font-size: 1.05rem;
      line-height: 1.5;
      margin-bottom: 20px;
      font-weight: 500;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    .option-btn {
      padding: 14px 16px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #f8fafc;
      text-align: left;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
    }

    .option-btn:hover {
      background: #334155;
    }

    .option-btn.selected {
      background: #2563eb;
      border-color: #60a5fa;
      font-weight: bold;
    }

    .nav-controls {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: auto;
      padding-top: 10px;
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .btn-secondary { background: #334155; color: white; }
    .btn-primary { background: #2563eb; color: white; }
    .btn-success { background: #16a34a; color: white; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .sidebar-panel {
      width: 100%;
      background: #1e293b;
      border-top: 1px solid #334155;
      padding: 12px;
      display: flex;
      flex-direction: column;
      max-height: 200px;
    }

    @media (min-width: 768px) {
      .sidebar-panel {
        width: 280px;
        max-height: 100%;
        border-top: none;
        border-left: 1px solid #334155;
      }
    }

    .sidebar-title {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .number-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(40px, 1fr));
      gap: 6px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .num-btn {
      aspect-ratio: 1;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #cbd5e1;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .num-btn.active {
      border-color: #38bdf8;
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.3);
    }

    .num-btn.answered {
      background: #16a34a;
      color: white;
      border-color: #22c55e;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.98);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 24px;
    }

    .form-group {
      width: 100%;
      max-width: 320px;
      margin-bottom: 16px;
      text-align: left;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      color: white;
      font-size: 1rem;
    }

    .form-group input:focus {
      outline: none;
      border-color: #2563eb;
    }

    #centipede-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9998;
    }
  </style>
</head>
<body>

  <!-- Canvas Kelabang -->
  <canvas id="centipede-canvas"></canvas>

  <!-- Overlay Modal Registrasi -->
  <div id="start-overlay" class="overlay">
    <h2 style="color: #38bdf8; margin-bottom: 8px;">Ujian CBT DKV Kelas XI</h2>
    <p style="color: #94a3b8; font-size: 0.9rem; margin-bottom: 8px;">Materi: Dasar & Teknik Fotografi - Videografi</p>
    <p style="color: #f59e0b; font-size: 0.85rem; font-weight: bold; margin-bottom: 20px;">⚠️ Target Nilai Ketuntasan Minimal: 80 (Soal Diacak)</p>
    
    <div class="form-group">
      <label for="student-name">Nama Lengkap Siswa:</label>
      <input type="text" id="student-name" placeholder="Masukkan nama lengkap..." autocomplete="off">
    </div>
    
    <div class="form-group">
      <label for="student-nis">NIS / NISN:</label>
      <input type="text" id="student-nis" placeholder="Masukkan NIS..." autocomplete="off">
    </div>

    <button class="btn btn-primary" style="width: 100%; max-width: 320px; padding: 14px; margin-top: 8px;" onclick="initExam()">Mulai Ujian Fullscreen</button>
  </div>

  <!-- Overlay Peringatan Pelanggaran -->
  <div id="warning-overlay" class="overlay" style="display: none;">
    <h2 style="color: #ef4444; margin-bottom: 12px;">Peringatan Keamanan!</h2>
    <p id="warning-msg" style="color: #cbd5e1; margin-bottom: 20px; max-width: 400px; line-height: 1.5;"></p>
    <button class="btn btn-primary" onclick="resumeExam()">Kembali ke Mode Fullscreen</button>
  </div>

  <!-- Aplikasi CBT Utama -->
  <div id="app-container">
    <header>
      <div class="header-title">CBT DKV XI | <span id="display-student">-</span></div>
      <div class="timer" id="timer-display">60:00</div>
    </header>

    <main>
      <section class="question-panel">
        <div class="question-header">Soal Nomor <span id="current-num">1</span> dari 50</div>
        <div class="question-text" id="question-text">Loading soal...</div>
        
        <div class="options-list" id="options-container"></div>

        <div class="nav-controls">
          <button class="btn btn-secondary" id="btn-prev" onclick="changeQuestion(-1)">Sebelumnya</button>
          <button class="btn btn-secondary" id="btn-next" onclick="changeQuestion(1)">Berikutnya</button>
          <button class="btn btn-success" id="btn-submit" onclick="confirmSubmit()">Selesai & Kirim</button>
        </div>
      </section>

      <section class="sidebar-panel">
        <div class="sidebar-title">Navigasi Soal</div>
        <div class="number-grid" id="number-grid"></div>
      </section>
    </main>
  </div>

  <script>
    const GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbxan3Ca7thzAZtqo0tmG3YJBpxwZtG5azbqcrGBogXZEzaNDyZ7J9szPGRGnMR3l43fWA/exec";

    // MASTER BANK SOAL (100 SOAL FOTOGRAFI & VIDEOGRAFI DKV)
    const allQuestionsBank = [
      { id: 1, q: "Komponen kamera yang berfungsi mengatur tingkat sensitivitas sensor terhadap cahaya adalah...", options: ["Aperture", "Shutter Speed", "ISO", "White Balance"], answer: "ISO" },
      { id: 2, q: "Semakin kecil angka f-stop pada lensa (contoh: f/1.8), maka...", options: ["Bukaan diafragma semakin lebar dan ruang tajam (DoF) semakin sempit", "Bukaan diafragma semakin sempit dan gambar semakin gelap", "Sensitivitas sensor meningkat tajam", "Kecepatan rana menjadi makin lambat"], answer: "Bukaan diafragma semakin lebar dan ruang tajam (DoF) semakin sempit" },
      { id: 3, q: "Fitur pada kamera yang digunakan untuk menyelaraskan warna putih agar objek terlihat alami adalah...", options: ["Focus Mode", "ISO", "White Balance", "Exposure Compensation"], answer: "White Balance" },
      { id: 4, q: "Kombinasi segitiga eksposure yang tepat saat mengambil foto objek bergerak cepat (freezing) ditentukan oleh...", options: ["Aperture", "Shutter Speed", "Focal Length", "Picture Profile"], answer: "Shutter Speed" },
      { id: 5, q: "Penggunaan ISO tinggi (misal: ISO 6400) pada kondisi minim cahaya akan menimbulkan...", options: ["Gambar menjadi blur", "Bintik-bintik digital (noise)", "Lensa menjadi panas", "Warna foto menjadi terlalu kontras"], answer: "Bintik-bintik digital (noise)" },
      { id: 6, q: "Efek bokeh (latar belakang kabur) paling mudah didapatkan jika kita menggunakan...", options: ["Diafragma f/22 dan lensa sudut lebar", "Diafragma f/1.4 dan jarak fokus dekat ke objek", "Shutter speed 1/1000 detik dan ISO rendah", "Shutter speed 2 detik dan tripod"], answer: "Diafragma f/1.4 dan jarak fokus dekat ke objek" },
      { id: 7, q: "Teknik fotografi yang menghasilkan jejak cahaya kendaraan pada malam hari dinamakan...", options: ["High Speed Photography", "Macro Photography", "Long Exposure / Slow Shutter", "Freeze Motion"], answer: "Long Exposure / Slow Shutter" },
      { id: 8, q: "Jenis lensa yang memiliki panjang fokus bervariasi (dapat diubah zoom-in/zoom-out) dinamakan...", options: ["Lensa Fix / Prime", "Lensa Zoom", "Lensa Fisheye", "Lensa Anamorphic"], answer: "Lensa Zoom" },
      { id: 9, q: "Fungsi utama dari tombol Shutter Release ditekan setengah jalan (half-press) adalah...", options: ["Mengunci fokus dan mengukur eksposure (metering)", "Langsung mengambil gambar", "Membuka diafragma secara otomatis", "Mengubah nilai ISO"], answer: "Mengunci fokus dan mengukur eksposure (metering)" },
      { id: 10, q: "Format file foto mentah yang menyimpan seluruh data informasi dari sensor tanpa kompresi adalah...", options: ["JPEG", "PNG", "RAW", "TIFF"], answer: "RAW" },
      { id: 11, q: "Satuan kecepatan rana (shutter speed) pada kamera umumnya diukur dalam...", options: ["Milimeter (mm)", "Detik atau pecahan detik", "Kelvin (K)", "Megapixel (MP)"], answer: "Detik atau pecahan detik" },
      { id: 12, q: "Lensa yang memiliki sudut pandang sangat lebar hingga mencapai 180 derajat dan cembung dinamakan...", options: ["Lensa Telephoto", "Lensa Macro", "Lensa Fisheye", "Lensa Standard"], answer: "Lensa Fisheye" },
      { id: 13, q: "Apabila hasil foto tampak sangat putih dan kehilangan detail karena terlalu banyak cahaya, kondisi tersebut dinamakan...", options: ["Under-exposed", "Over-exposed", "Out of focus", "High Contrast"], answer: "Over-exposed" },
      { id: 14, q: "Skala suhu warna White Balance dinyatakan dalam satuan...", options: ["Celcius", "Fahrenheit", "Kelvin", "Diopter"], answer: "Kelvin" },
      { id: 15, q: "Bagian kamera refleks yang berfungsi memantulkan cahaya dari lensa ke viewfinder dinamakan...", options: ["Cermin Pentaprisma / Mirror", "Diopter", "Sensor CMOS", "Shutter Curtain"], answer: "Cermin Pentaprisma / Mirror" },
      { id: 16, q: "Aturan komposisi yang membagi bingkai foto menjadi 9 bagian sejajar dinamakan...", options: ["Golden Ratio", "Rule of Thirds", "Symmetry", "Framing Technique"], answer: "Rule of Thirds" },
      { id: 17, q: "Teknik komposisi memanfaatkan elemen di sekitar objek (seperti jendela/pintu) dinamakan...", options: ["Leading Lines", "Framing", "Fill the Frame", "Pattern"], answer: "Framing" },
      { id: 18, q: "Sudut pengambilan gambar di mana posisi kamera berada lebih rendah dari objek dinamakan...", options: ["High Angle", "Eye Level", "Low Angle", "Bird Eye View"], answer: "Low Angle" },
      { id: 19, q: "Pengambilan foto dari ketinggian tegak lurus mengarah ke bawah dinamakan...", options: ["Bird Eye View", "Frog Eye View", "High Angle", "Top Angle"], answer: "Bird Eye View" },
      { id: 20, q: "Elemen garis dalam foto yang berfungsi menuntun mata pengamat menuju ke subjek utama dinamakan...", options: ["Vanishing Point", "Leading Lines", "Horizon Line", "Diagonals"], answer: "Leading Lines" },
      { id: 21, q: "Mengisi seluruh bingkai foto penuh dengan subjek utama tanpa ruang kosong dinamakan...", options: ["Negative Space", "Fill the Frame", "Centered Composition", "Minimalist"], answer: "Fill the Frame" },
      { id: 22, q: "Ruang kosong di sekitar subjek utama yang memberikan kesan bernapas dinamakan...", options: ["Negative Space", "Headroom", "Looking Room", "Background"], answer: "Negative Space" },
      { id: 23, q: "Sudut pandang kamera sejajar dengan ketinggian mata objek yang diambil dinamakan...", options: ["Low Angle", "Top Angle", "Eye Level", "Dutch Angle"], answer: "Eye Level" },
      { id: 24, q: "Sudut kamera yang sengaja dimiringkan untuk menciptakan kesan ketegangan dinamakan...", options: ["Bird Eye View", "Dutch Angle / Tilt Angle", "Frog Eye View", "High Angle"], answer: "Dutch Angle / Tilt Angle" },
      { id: 25, q: "Aturan Headroom dalam komposisi foto/video portrait mengatur tentang...", options: ["Jarak ruang antara bagian atas kepala subjek dengan batas atas bingkai", "Jarak antara pandangan mata subjek ke arah samping", "Ketinggian lensa dari bahu subjek", "Pencahayaan di atas kepala subjek"], answer: "Jarak ruang antara bagian atas kepala subjek dengan batas atas bingkai" },
      { id: 26, q: "Jumlah bingkai gambar yang diputar dalam satu detik video dinyatakan dalam...", options: ["Bitrate", "Resolution", "FPS (Frames Per Second)", "Aspect Ratio"], answer: "FPS (Frames Per Second)" },
      { id: 27, q: "Standar Frame Rate yang umum digunakan dalam penayangan sinema/film komersial adalah...", options: ["15 fps", "24 fps", "60 fps", "120 fps"], answer: "24 fps" },
      { id: 28, q: "Jenis ukuran shot yang menampilkan seluruh tubuh manusia beserta lingkungan secara sangat luas dinamakan...", options: ["Medium Shot", "Close-Up", "Extreme Long Shot (ELS)", "Full Shot"], answer: "Extreme Long Shot (ELS)" },
      { id: 29, q: "Ukuran shot yang menampilkan objek manusia dari batas pinggang hingga atas kepala dinamakan...", options: ["Close-Up", "Medium Shot (MS)", "Extreme Close-Up", "Long Shot"], answer: "Medium Shot (MS)" },
      { id: 30, q: "Shot yang difokuskan pada detail sangat spesifik seperti mata atau jemari dinamakan...", options: ["Big Close-Up", "Extreme Close-Up (ECU)", "Medium Close-Up", "Detail Shot"], answer: "Extreme Close-Up (ECU)" },
      { id: 31, q: "Over the Shoulder Shot (OTS) umumnya digunakan dalam adegan...", options: ["Pemandangan alam", "Olahraga ekstrim", "Percakapan antara dua orang karakter", "Aksi kejar-kejaran mobil"], answer: "Percakapan antara dua orang karakter" },
      { id: 32, q: "Rasio aspek standar layar monitor widescreen modern dan video YouTube adalah...", options: ["4:3", "1:1", "16:9", "9:16"], answer: "16:9" },
      { id: 33, q: "Perbedaan utama antara video Interlaced (1080i) dan Progressive (1080p) terletak pada...", options: ["Cara pemindaian baris gambar (ganjil-genap vs berurutan)", "Jumlah audio track", "Warna video yang dihasilkan", "Ukuran resolusi horizontal"], answer: "Cara pemindaian baris gambar (ganjil-genap vs berurutan)" },
      { id: 34, q: "Ruang kosong di depan arah pandang wajah objek dinamakan...", options: ["Headroom", "Looking Room / Noseroom", "Walking Room", "Lead Room"], answer: "Looking Room / Noseroom" },
      { id: 35, q: "Point of View (POV) shot adalah pengambilan gambar yang menunjukkan...", options: ["Sudut pandang sutradara", "Sudut pandang mata dari karakter dalam film", "Penonton dari balik layar", "Sudut pandang dari atas udara"], answer: "Sudut pandang mata dari karakter dalam film" },
      { id: 36, q: "Pergerakan kepala kamera secara horizontal dari kiri ke kanan tanpa menggeser tripod dinamakan...", options: ["Panning", "Tilting", "Dolly", "Pedestal"], answer: "Panning" },
      { id: 37, q: "Pergerakan kepala kamera secara vertikal (ke atas/ke bawah) pada porosnya dinamakan...", options: ["Panning", "Tilting", "Tracking", "Crab"], answer: "Tilting" },
      { id: 38, q: "Menggerakkan seluruh badan kamera mendekati atau menjauhi objek menggunakan rek dinamakan...", options: ["Zoom In / Zoom Out", "Dolly In / Dolly Out", "Pan Left / Pan Right", "Tilt Up / Tilt Down"], answer: "Dolly In / Dolly Out" },
      { id: 39, q: "Menggerakkan kamera secara fisik sejajar menyamping di sebelah objek dinamakan...", options: ["Pedestal", "Arc", "Crab / Tracking Shot", "Tilting"], answer: "Crab / Tracking Shot" },
      { id: 40, q: "Perbedaan mendasar antara Zoom In dan Dolly In adalah...", options: ["Zoom mengubah focal length lensa, sedangkan Dolly memindahkan posisi kamera secara fisik", "Zoom membutuhkan roda, Dolly menggunakan tombol", "Zoom tidak mengubah perspektif latar belakang", "Dolly membuat gambar menjadi blur"], answer: "Zoom mengubah focal length lensa, sedangkan Dolly memindahkan posisi kamera secara fisik" },
      { id: 41, q: "Dalam teknik Three-Point Lighting, cahaya utama yang paling terang dinamakan...", options: ["Key Light", "Fill Light", "Back Light", "Ambient Light"], answer: "Key Light" },
      { id: 42, q: "Fungsi dari Fill Light pada tata cahaya 3 titik adalah...", options: ["Memisahkan subjek dari latar belakang", "Mengisi/mengurangi bayangan tajam yang dihasilkan oleh Key Light", "Menerangi latar belakang secara penuh", "Memberikan efek kilau pada rambut"], answer: "Mengisi/mengurangi bayangan tajam yang dihasilkan oleh Key Light" },
      { id: 43, q: "Lampu yang diletakkan di belakang subjek mengarah ke kamera untuk memberi garis batas dinamakan...", options: ["Key Light", "Fill Light", "Back Light", "Practical Light"], answer: "Back Light" },
      { id: 44, q: "Menggerakkan posisi fisik kamera naik atau turun secara vertikal dinamakan...", options: ["Tilting", "Pedestal (Ped Up / Ped Down)", "Dolly", "Rolling"], answer: "Pedestal (Ped Up / Ped Down)" },
      { id: 45, q: "Alat bantu penstabil gerak kamera saat videografer mengambil gambar sambil berjalan dinamakan...", options: ["Monopod", "Slider", "Gimbal / Steadicam", "Rig Shoulder"], answer: "Gimbal / Steadicam" },
      { id: 46, q: "Sketsa gambar berurutan beserta deskripsi adegan film dinamakan...", options: ["Naskah / Script", "Storyboard", "Floorplan", "Call Sheet"], answer: "Storyboard" },
      { id: 47, q: "Pemotongan adegan video dari satu shot ke shot lain secara langsung tanpa transisi dinamakan...", options: ["Cut", "Dissolve", "Fade Out", "Wipe"], answer: "Cut" },
      { id: 48, q: "Transisi video di mana gambar perlahan menghilang menjadi warna hitam dinamakan...", options: ["Cross Dissolve", "Fade to Black", "Cut on Action", "Jump Cut"], answer: "Fade to Black" },
      { id: 49, q: "Proses penyesuaian dan penciptaan mood warna pada video dinamakan...", options: ["Color Correction", "Color Grading", "Rendering", "Compositing"], answer: "Color Grading" },
      { id: 50, q: "Kesalahan kesinambungan elemen antar-shot dinamakan pelanggaran...", options: ["Rule of Thirds", "Continuity", "Aspect Ratio", "Pacing"], answer: "Continuity" },

      // SOAL TAMBAHAN (51 - 100)
      { id: 51, q: "Lensa fix 50mm sering disebut sebagai lensa standar karena...", options: ["Memiliki perspektif yang paling mirip dengan sudut pandang mata manusia", "Bisa melakukan zoom sangat jauh", "Harganya selalu paling murah", "Dapat mengambil gambar tanpa cahaya"], answer: "Memiliki perspektif yang paling mirip dengan sudut pandang mata manusia" },
      { id: 52, q: "Istilah 'Depth of Field' (DoF) dalam fotografi merujuk pada...", options: ["Kedalaman ruang tajam atau area fokus dalam gambar", "Kecepatan pergerakan sensor kamera", "Tingkat kontras warna dalam foto", "Kekuatan kilatan lampu flash"], answer: "Kedalaman ruang tajam atau area fokus dalam gambar" },
      { id: 53, q: "Aperture dengan nilai f/22 akan menghasilkan...", options: ["Ruang tajam sangat luas, seluruh latar belakang terlihat jelas", "Ruang tajam sangat sempit dan latar kabur", "Foto menjadi sangat terang di malam hari", "Kecepatan fokus menjadi dua kali lebih cepat"], answer: "Ruang tajam sangat luas, seluruh latar belakang terlihat jelas" },
      { id: 54, q: "Fungsi utama dari penggunaan Parasol / Lens Hood pada lensa adalah...", options: ["Mencegah pantulan cahaya luar (flare) masuk ke lensa", "Membuat fokus gambar menjadi lebih tajam", "Mengubah warna foto menjadi kebiruan", "Melindungi kamera dari air laut"], answer: "Mencegah pantulan cahaya luar (flare) masuk ke lensa" },
      { id: 55, q: "Teknik 'Panning' dilakukan dengan cara menggerakkan kamera mengikuti arah objek bergerak menggunakan Shutter Speed...", options: ["Lambat (misal 1/15s sampai 1/30s)", "Sangat cepat (misal 1/2000s)", "Tinggi (misal 1/1000s)", "Bulb Mode 10 detik"], answer: "Lambat (misal 1/15s sampai 1/30s)" },

      { id: 100, q: "Aturan 'Golden Ratio' (Rasio Emas) dalam komposisi visual didasarkan pada proporsi matematis sebesar...", options: ["1 : 1.618", "1 : 2.5", "3 : 4", "16 : 9"], answer: "1 : 1.618" }
    ];

    let questions = []; // Akan diisi 50 soal hasil acakan
    let currentIdx = 0;
    let userAnswers = {};
    let studentData = { name: "", nis: "" };
    let cheatViolations = 0;
    const maxViolations = 3;
    let timerInterval = null;
    let timeLeft = 3600;

    // Fungsi Acak Array (Fisher-Yates Shuffle)
    function shuffleArray(array) {
      let curId = array.length;
      let clone = [...array];
      while (0 !== curId) {
        let randId = Math.floor(Math.random() * curId);
        curId -= 1;
        let tmp = clone[curId];
        clone[curId] = clone[randId];
        clone[randId] = tmp;
      }
      return clone;
    }

    // Pindai data remidi begitu halaman dimuat
    window.addEventListener('DOMContentLoaded', () => {
      const savedName = localStorage.getItem('cbt_student_name');
      const savedNis = localStorage.getItem('cbt_student_nis');

      if (savedName && savedNis) {
        document.getElementById('student-name').value = savedName;
        document.getElementById('student-nis').value = savedNis;
        
        if (localStorage.getItem('cbt_auto_restart') === 'true') {
          localStorage.removeItem('cbt_auto_restart');
          initExam();
        }
      }
    });

    // Blokir Shortcut
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', e => {
      if (
        e.key === 'F12' || 
        e.key === 'Meta' || 
        (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J')) || 
        (e.ctrlKey && e.key === 'u')
      ) {
        e.preventDefault();
        e.stopPropagation();
      }
    });

    function initExam() {
      const nameVal = document.getElementById('student-name').value.trim();
      const nisVal = document.getElementById('student-nis').value.trim();

      if (!nameVal || !nisVal) {
        alert("Mohon isi Nama Lengkap dan NIS terlebih dahulu!");
        return;
      }

      localStorage.setItem('cbt_student_name', nameVal);
      localStorage.setItem('cbt_student_nis', nisVal);

      studentData.name = nameVal;
      studentData.nis = nisVal;
      document.getElementById('display-student').innerText = `${nameVal} (${nisVal})`;

      // ACAK BANK SOAL (PILIH 50 SOAL DARI 100 SOAL)
      const shuffledBank = shuffleArray(allQuestionsBank).slice(0, 50);

      // ACAK OPSI JAWABAN TIAP SOAL
      questions = shuffledBank.map(item => {
        const shuffledOpts = shuffleArray(item.options);
        return {
          id: item.id,
          q: item.q,
          options: shuffledOpts,
          correctAnswerText: item.answer // Mengunci teks jawaban asli
        };
      });

      requestFullscreenMode();
      document.getElementById('start-overlay').style.display = 'none';

      buildNumberGrid();
      loadQuestion(0);
      startTimer();
      setupAntiCheat();

      setTimeout(spawnProceduralCentipede, 10000);
    }

    function requestFullscreenMode() {
      const elem = document.documentElement;
      if (elem.requestFullscreen) {
        elem.requestFullscreen().catch(() => {});
      } else if (elem.webkitRequestFullscreen) {
        elem.webkitRequestFullscreen();
      }
    }

    function setupAntiCheat() {
      document.addEventListener("visibilitychange", () => {
        if (document.hidden && document.getElementById('start-overlay').style.display === 'none') {
          handleViolation("Anda terdeteksi berpindah tab, membuka aplikasi lain, atau meminimalkan browser.");
        }
      });

      document.addEventListener("fullscreenchange", () => {
        if (!document.fullscreenElement && document.getElementById('start-overlay').style.display === 'none') {
          handleViolation("Anda keluar dari mode layar penuh (Fullscreen).");
        }
      });

      window.addEventListener("blur", () => {
        if (document.getElementById('start-overlay').style.display === 'none') {
          handleViolation("Anda terdeteksi menekan tombol Windows / membuka menu aplikasi luar.");
        }
      });
    }

    function handleViolation(reasonText) {
      cheatViolations++;
      if (cheatViolations >= maxViolations) {
        alert(`Batas pelanggaran keamanan tercapai (${cheatViolations}/${maxViolations}). Jawaban Anda akan di-submit otomatis.`);
        submitExam("Diskualifikasi: Pelanggaran Keamanan Berulang");
      } else {
        document.getElementById('warning-msg').innerText = `${reasonText}\n\nPeringatan (${cheatViolations}/${maxViolations}). Jika mencapai ${maxViolations} kali, ujian akan dihentikan secara otomatis.`;
        document.getElementById('warning-overlay').style.display = 'flex';
      }
    }

    function resumeExam() {
      requestFullscreenMode();
      document.getElementById('warning-overlay').style.display = 'none';
    }

    function startTimer() {
      timerInterval = setInterval(() => {
        timeLeft--;
        const mins = Math.floor(timeLeft / 60);
        const secs = timeLeft % 60;
        document.getElementById('timer-display').innerText = 
          `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;

        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          alert("Waktu ujian telah habis!");
          submitExam("Waktu Habis");
        }
      }, 1000);
    }

    function buildNumberGrid() {
      const grid = document.getElementById('number-grid');
      grid.innerHTML = '';
      for (let i = 0; i < questions.length; i++) {
        const btn = document.createElement('button');
        btn.className = 'num-btn';
        btn.id = `num-btn-${i}`;
        btn.innerText = i + 1;
        btn.onclick = () => loadQuestion(i);
        grid.appendChild(btn);
      }
    }

    function loadQuestion(idx) {
      currentIdx = idx;
      document.getElementById('current-num').innerText = idx + 1;
      document.getElementById('question-text').innerText = questions[idx].q;

      document.getElementById('btn-prev').disabled = (idx === 0);
      document.getElementById('btn-next').disabled = (idx === questions.length - 1);

      document.querySelectorAll('.num-btn').forEach((btn, i) => {
        btn.classList.toggle('active', i === idx);
      });

      const container = document.getElementById('options-container');
      container.innerHTML = '';

      const letters = ['A', 'B', 'C', 'D'];
      questions[idx].options.forEach((optText, oIdx) => {
        const letter = letters[oIdx];
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        
        // Cek jika opsi ini sudah dipilih
        if (userAnswers[questions[idx].id] === optText) {
          btn.classList.add('selected');
        }
        
        btn.innerText = `${letter}. ${optText}`;
        btn.onclick = () => selectOption(questions[idx].id, optText);
        container.appendChild(btn);
      });
    }

    function selectOption(qId, selectedText) {
      userAnswers[qId] = selectedText;
      loadQuestion(currentIdx);

      const numBtn = document.getElementById(`num-btn-${currentIdx}`);
      if (numBtn) {
        numBtn.classList.add('answered');
      }
    }

    function changeQuestion(dir) {
      const newIdx = currentIdx + dir;
      if (newIdx >= 0 && newIdx < questions.length) {
        loadQuestion(newIdx);
      }
    }

    function confirmSubmit() {
      const answeredCount = Object.keys(userAnswers).length;
      const total = questions.length;
      if (confirm(`Anda telah menjawab ${answeredCount} dari ${total} soal.\nApakah Anda yakin ingin menyelesaikan ujian?`)) {
        submitExam("Selesai Normal");
      }
    }

    window.restartExamDirectly = function() {
      localStorage.setItem('cbt_auto_restart', 'true');
      window.location.reload();
    };

    function submitExam(statusReason) {
      clearInterval(timerInterval);

      // PENSKORAN PRESISI (Mencocokkan teks jawaban)
      let correctAnswers = 0;
      questions.forEach(q => {
        if (userAnswers[q.id] === q.correctAnswerText) {
          correctAnswers++;
        }
      });

      const finalScore = (correctAnswers / questions.length) * 100;
      const isPassed = finalScore >= 80;
      const statusLulus = isPassed ? "LULUS" : "REMIDI (Wajib Ulang)";

      const payload = {
        name: studentData.name,
        nis: studentData.nis,
        score: finalScore,
        correctCount: correctAnswers,
        totalQuestions: questions.length,
        status: `${statusReason} | ${statusLulus}`,
        violations: cheatViolations,
        answers: userAnswers
      };

      fetch(GAS_WEBAPP_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      }).catch(err => console.error("Error submitting:", err));

      if (isPassed) {
        localStorage.removeItem('cbt_student_name');
        localStorage.removeItem('cbt_student_nis');

        document.body.innerHTML = `
          <div class="overlay">
            <h2 style="color: #22c55e; margin-bottom: 12px;">Selamat, Anda LULUS!</h2>
            <p style="color: #cbd5e1; margin-bottom: 8px;">Terima kasih, <b>${studentData.name}</b>.</p>
            <p style="color: #94a3b8; font-size: 0.9rem; margin-bottom: 24px;">Nilai Anda telah memenuhi batas minimal ketuntasan (KKM 80).</p>
            <div style="background: #1e293b; padding: 20px; border-radius: 8px; border: 1px solid #334155; min-width: 260px; text-align: center;">
              <div style="font-size: 0.85rem; color: #94a3b8;">Nilai Akhir:</div>
              <div style="font-size: 2.8rem; font-weight: bold; color: #22c55e;">${finalScore.toFixed(1)}</div>
              <div style="font-size: 0.85rem; color: #cbd5e1; margin-top: 4px;">Benar ${correctAnswers} dari ${questions.length} Soal</div>
            </div>
          </div>
        `;
      } else {
        document.body.innerHTML = `
          <div class="overlay">
            <h2 style="color: #ef4444; margin-bottom: 12px;">Nilai Belum Mencapai Target!</h2>
            <p style="color: #cbd5e1; margin-bottom: 8px;">Mohon maaf, <b>${studentData.name} (${studentData.nis})</b>.</p>
            <p style="color: #f87171; font-size: 0.9rem; margin-bottom: 20px;">Batas minimal nilai adalah <b>80</b>. Anda wajib mengulangi ujian ini.</p>
            
            <div style="background: #1e293b; padding: 20px; border-radius: 8px; border: 1px solid #334155; min-width: 260px; text-align: center; margin-bottom: 24px;">
              <div style="font-size: 0.85rem; color: #94a3b8;">Nilai Percobaan Ini:</div>
              <div style="font-size: 2.8rem; font-weight: bold; color: #ef4444;">${finalScore.toFixed(1)}</div>
              <div style="font-size: 0.85rem; color: #cbd5e1; margin-top: 4px;">Benar ${correctAnswers} dari ${questions.length} Soal</div>
            </div>

            <button class="btn btn-primary" style="padding: 14px 28px; font-size: 1rem;" onclick="restartExamDirectly()">
              🔄 Mengulang Ujian Sekarang
            </button>
          </div>
        `;
      }
    }

    /* KELABANG GARIS-GARIS ANIMATED */
    const canvas = document.getElementById('centipede-canvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    let centipede = null;

    class Centipede {
      constructor() {
        this.numSegments = 16;
        this.segmentLength = 8;
        this.x = -100;
        this.y = Math.random() * (canvas.height - 200) + 100;
        this.angle = 0;
        this.speed = 2.2;
        this.health = 5;
        this.isDead = false;
        this.squishFactor = 1;
        this.legWiggle = 0;

        this.segments = [];
        for (let i = 0; i < this.numSegments; i++) {
          this.segments.push({ x: this.x - i * this.segmentLength, y: this.y });
        }
      }

      update() {
        if (this.isDead) {
          if (this.squishFactor > 0.1) this.squishFactor -= 0.05;
          return;
        }

        this.legWiggle += 0.3;
        this.angle += Math.sin(this.legWiggle * 0.3) * 0.05;

        this.x += Math.cos(this.angle) * this.speed;
        this.y += Math.sin(this.angle) * this.speed;
        this.segments[0] = { x: this.x, y: this.y };

        for (let i = 1; i < this.numSegments; i++) {
          const prev = this.segments[i - 1];
          const curr = this.segments[i];
          const dx = prev.x - curr.x;
          const dy = prev.y - curr.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist > 0) {
            curr.x = prev.x - (dx / dist) * this.segmentLength;
            curr.y = prev.y - (dy / dist) * this.segmentLength;
          }
        }
      }

      draw() {
        ctx.save();
        for (let i = this.numSegments - 1; i >= 0; i--) {
          const seg = this.segments[i];
          const nextSeg = this.segments[i - 1] || seg;
          const segAngle = Math.atan2(nextSeg.y - seg.y, nextSeg.x - seg.x);

          ctx.save();
          ctx.translate(seg.x, seg.y);
          ctx.rotate(segAngle);
          ctx.scale(1, this.squishFactor);

          if (i > 0 && i < this.numSegments - 1) {
            ctx.strokeStyle = '#ea580c';
            ctx.lineWidth = 2;

            const legWave = Math.sin(this.legWiggle + i * 0.6) * 10;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(-2, -14 - legWave);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(-2, 14 + legWave);
            ctx.stroke();
          }

          ctx.fillStyle = i === 0 ? '#b91c1c' : '#c2410c';
          ctx.beginPath();
          ctx.ellipse(0, 0, 6, 4, 0, 0, Math.PI * 2);
          ctx.fill();

          if (i === 0) {
            ctx.strokeStyle = '#ef4444';
            ctx.lineWidth = 1.5;
            
            ctx.beginPath();
            ctx.moveTo(4, -2);
            ctx.lineTo(16, -10);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(4, 2);
            ctx.lineTo(16, 10);
            ctx.stroke();
          }

          ctx.restore();
        }
        ctx.restore();
      }

      hitTest(mx, my) {
        for (let seg of this.segments) {
          const dx = mx - seg.x;
          const dy = my - seg.y;
          if (Math.sqrt(dx * dx + dy * dy) < 22) {
            return true;
          }
        }
        return false;
      }
    }

    function animateCentipede() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (centipede) {
        centipede.update();
        centipede.draw();

        if (centipede.x > canvas.width + 150) {
          centipede = null;
        }
      }

      requestAnimationFrame(animateCentipede);
    }
    animateCentipede();

    function spawnProceduralCentipede() {
      if (document.getElementById('start-overlay').style.display !== 'none') return;
      if (!centipede) {
        centipede = new Centipede();
      }
    }

    window.addEventListener('click', (e) => {
      if (centipede && !centipede.isDead) {
        if (centipede.hitTest(e.clientX, e.clientY)) {
          centipede.health--;
          centipede.speed += 0.5;

          if (centipede.health <= 0) {
            centipede.isDead = true;
            setTimeout(() => {
              centipede = null;
            }, 2000);
          }
        }
      }
    });

    setInterval(() => {
      if (Math.random() > 0.3) {
        spawnProceduralCentipede();
      }
    }, 40000);
  </script>
</body>
</html>
